<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar</title>
</head>
<body>
    <h1>Pendaftaran Ekskul SMKM 3</h1>
    <table>
        <form>
            <tr>
                <th>Nama Lengkap :</th><br>
                <td><input type="text" name="nama lengkap" placeholder="Ketik namamu di sini" required></td><br><br>
            </tr>
            <tr>    
                <th>Tanggal Lahir :</th><br>
                <td><input type="date" name="tanggal lahir" required></td><br><br>
            </tr>
            <tr>   
                <th>Nomor HP/WA :</th><br>
                <td><input type="number" name="nomor hp" required></td><br><br>
            </tr>    
            <tr>
               <td><button type="submit" name="Daftar">Daftar Sekarang!</button></td>
            </tr>    
        </form>
    </table>
</body>
</html>
