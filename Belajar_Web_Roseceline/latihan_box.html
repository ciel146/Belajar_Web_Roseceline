<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan box</title>
    <style>
        .btn-keren {
            background-color: #007bff; /* Warna latar biru */
            color: white; /* Teks putih */
            padding: 10px 20px; /* Busa dalam: 10px atas/bawah, 20px kiri/kanan */
            margin-left: 20px; /* Menjauh dari tombol pertama sejauh 20px */
            border: none; /* Menghilangkan garis tepi bawaan yang kaku */
            border-radius: 25px; /* Membuat ujungnya melengkung bundar */
            font-size: 16px;
            cursor: pointer; /* Mengubah kursor panah menjadi bentuk tangan saat diarahkan */
}
    </style>
</head>
<body>
    <button class="btn-biasa">Tombol Bawaan</button>
    <button class="btn-keren">Tombol Modern</button>

</body>
</html>
